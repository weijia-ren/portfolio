<svg xmlns="http://www.w3.org/2000/svg" width="74" height="74" viewBox="0 0 74 74">
  <rect width="74" height="74" rx="16" fill="#0f172a"/>
  <defs>
    <linearGradient id="tabFront" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background tab (duplicate being closed) -->
  <rect x="23" y="17" width="35" height="27" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.8" opacity="0.8" />
  <circle cx="51" cy="23" r="3.5" fill="#ef4444" opacity="0.85" />
  <line x1="49.5" y1="21.5" x2="52.5" y2="24.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
  <line x1="52.5" y1="21.5" x2="49.5" y2="24.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

  <!-- Foreground tab (kept active) -->
  <rect x="15" y="27" width="37" height="30" rx="7" fill="#1e293b" stroke="url(#tabFront)" stroke-width="2.2" />
  <!-- Address bar / tab indicator -->
  <line x1="22" y1="35" x2="35" y2="35" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="44" cy="35" r="2.2" fill="#10b981" />
  <!-- Body placeholders -->
  <line x1="22" y1="43" x2="45" y2="43" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
  <line x1="22" y1="48" x2="38" y2="48" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />
</svg>

